# Stage 3: PostgreSQL for the chronicle (world-history). Local development only.
# Start: docker compose up -d    Stop: docker compose down    Wipe data: docker compose down -v
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: npcworld
      POSTGRES_USER: npcworld
      POSTGRES_PASSWORD: npcworld
    ports:
      - "55432:5432"   # an unusual host port, so it does not clash with another local PostgreSQL
    volumes:
      - npcworld-db:/var/lib/postgresql/data

volumes:
  npcworld-db:
