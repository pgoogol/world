[project]
name = "brain"
version = "0.1.0"
description = "NPC brains: gRPC server and Q-learning for the NPC world simulation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "grpcio>=1.75",
    "protobuf>=6.31",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.75",
    "pytest>=8.4",
]
nn = [
    "torch>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
